openapi: 3.0.3
info:
  title: Contratos XML de Clínica Sor Ana
  version: 1.0.0
  description: Capacidades de grano grueso expuestas por sistemas autónomos durante Inicio y Planificación.
servers:
  - url: http://localhost:8001
    description: Sistema autónomo de citas PHP
  - url: http://localhost:8002
    description: Sistema autónomo de laboratorio Python
paths:
  /:
    get:
      operationId: ConsultarCitasPorPaciente
      summary: Consulta las citas de un paciente
      parameters: []
      responses: { '200': { description: Lista XML de citas del sistema de citas } }
    post:
      operationId: CrearCita
      summary: Registra una cita XML
      requestBody:
        required: true
        content:
          application/xml: { schema: { $ref: '../schemas/cita.xsd' } }
      responses: { '201': { description: Cita creada } }
  /resultados:
    get:
      operationId: ConsultarResultadosPorPaciente
      summary: Consulta resultados clínicos de un paciente
      responses: { '200': { description: Lista XML de resultados del sistema de laboratorio } }
    post:
      operationId: CrearResultado
      summary: Registra un resultado XML
      requestBody:
        required: true
        content:
          application/xml: { schema: { $ref: '../schemas/resultado.xsd' } }
      responses: { '201': { description: Resultado creado } }
